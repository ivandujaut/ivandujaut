name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Desde que las páginas se prerenderizan, `generateMetadata` corre en
          # el build y firma la URL de la imagen OG, así que `lib/og-sign.ts`
          # exige el secreto (tira si falta y NODE_ENV es production, que es lo
          # que pone `next build`). Antes no hacía falta porque el build no
          # renderizaba ninguna página.
          #
          # Acá va un valor de mentira a propósito: este job sólo verifica que
          # el build pase y tira el resultado. Las firmas que llegan a
          # producción las hace el build de Vercel con el secreto de verdad.
          OG_SECRET: ci-build-check-not-a-real-secret
