version: 2

updates:
  # Dependencias de npm (tu package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    ignore:
      # ESLint 10 todavía no es compatible con eslint-config-next
      - dependency-name: "eslint"
        versions: ["10.x"]
    open-pull-requests-limit: 5
    # Agrupa updates relacionados en un solo PR
    groups:
      # Todas las deps de desarrollo en un PR semanal
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Todas las deps de producción en otro PR
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # Next.js y React por separado (suelen tener cambios importantes)
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
    # Updates major no se agrupan, vienen como PRs individuales
    # para que los puedas revisar con cuidado
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Updates de las propias GitHub Actions (actions/checkout, setup-node, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
